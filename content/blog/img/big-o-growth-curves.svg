<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="big-o-growth-title big-o-growth-desc">
  <title id="big-o-growth-title">The growth shapes of common Big O complexity classes</title>
  <desc id="big-o-growth-desc">An editorial plotter-style chart directly labels constant, logarithmic, linear, linearithmic, and quadratic curves. A side ruler explains what happens to the work when the input doubles.</desc>

  <defs>
    <pattern id="growth-minor-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#9AAAC0" stroke-width="1" opacity=".14"/>
    </pattern>
    <pattern id="growth-major-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#growth-minor-grid)"/>
      <path d="M120 0H0V120" fill="none" stroke="#74869F" stroke-width="1.5" opacity=".18"/>
    </pattern>
    <marker id="growth-axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#14243A"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#F3F6FA"/>
  <rect width="1200" height="720" fill="url(#growth-major-grid)"/>
  <rect width="18" height="720" fill="#174AE4"/>

  <g font-family="Avenir Next,Segoe UI,Arial,sans-serif">
    <text x="64" y="52" fill="#174AE4" font-size="14" font-weight="700" letter-spacing="2.6">ALGORITHM LAB / PLATE 01</text>
    <text x="64" y="108" fill="#14243A" font-size="46" font-weight="800" letter-spacing="-1.5">Growth has a shape.</text>
    <text x="66" y="142" fill="#53647A" font-size="18">Follow the line as the input moves from small to large.</text>
  </g>

  <g>
    <rect x="64" y="178" width="906" height="478" fill="#F9FBFD" stroke="#14243A" stroke-width="2"/>
    <rect x="64" y="178" width="906" height="12" fill="#14243A"/>

    <g stroke="#8FA0B6" stroke-width="1" opacity=".42">
      <path d="M126 238H934M126 318H934M126 398H934M126 478H934M126 558H934"/>
      <path d="M288 220V594M450 220V594M612 220V594M774 220V594"/>
    </g>

    <path d="M126 220V594H940" fill="none" stroke="#14243A" stroke-width="3" marker-end="url(#growth-axis-arrow)"/>
    <text x="533" y="632" text-anchor="middle" fill="#53647A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing=".8">INPUT SIZE, n  →</text>
    <text x="91" y="407" transform="rotate(-90 91 407)" text-anchor="middle" fill="#53647A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing=".8">OPERATIONS  →</text>

    <g fill="#53647A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12">
      <text x="126" y="614" text-anchor="middle">small</text>
      <text x="450" y="614" text-anchor="middle">growing</text>
      <text x="774" y="614" text-anchor="middle">large</text>
    </g>

    <path d="M132 554H812" fill="none" stroke="#2A9D8F" stroke-width="7"/>
    <path d="M132 554C270 532 464 515 812 488" fill="none" stroke="#00A6C7" stroke-width="7"/>
    <path d="M132 554L812 384" fill="none" stroke="#174AE4" stroke-width="7"/>
    <path d="M132 554C326 535 548 458 812 288" fill="none" stroke="#7B4DCC" stroke-width="7"/>
    <path d="M132 554C432 550 676 448 812 214" fill="none" stroke="#F05A47" stroke-width="7"/>

    <g font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700">
      <path d="M812 214H840" stroke="#F05A47" stroke-width="3"/>
      <rect x="840" y="196" width="104" height="36" fill="#F05A47"/>
      <text x="892" y="220" text-anchor="middle" fill="#FFFFFF">O(n²)</text>

      <path d="M812 288H840" stroke="#7B4DCC" stroke-width="3"/>
      <rect x="840" y="270" width="104" height="36" fill="#7B4DCC"/>
      <text x="892" y="294" text-anchor="middle" fill="#FFFFFF">O(n log n)</text>

      <path d="M812 384H840" stroke="#174AE4" stroke-width="3"/>
      <rect x="840" y="366" width="104" height="36" fill="#174AE4"/>
      <text x="892" y="390" text-anchor="middle" fill="#FFFFFF">O(n)</text>

      <path d="M812 488H840" stroke="#00A6C7" stroke-width="3"/>
      <rect x="840" y="470" width="104" height="36" fill="#00A6C7"/>
      <text x="892" y="494" text-anchor="middle" fill="#062C35">O(log n)</text>

      <path d="M812 554H840" stroke="#2A9D8F" stroke-width="3"/>
      <rect x="840" y="536" width="104" height="36" fill="#2A9D8F"/>
      <text x="892" y="560" text-anchor="middle" fill="#FFFFFF">O(1)</text>
    </g>
  </g>

  <g transform="translate(1002 178)">
    <rect width="156" height="478" fill="#14243A"/>
    <rect width="156" height="12" fill="#D7F238"/>
    <text x="22" y="52" fill="#D7F238" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.4">DOUBLE n</text>
    <text x="22" y="80" fill="#FFFFFF" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">What</text>
    <text x="22" y="102" fill="#FFFFFF" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">changes?</text>

    <g font-family="SFMono-Regular,Menlo,Consolas,monospace">
      <path d="M22 110H134" stroke="#53647A"/>

      <text x="22" y="145" fill="#8EA0B8" font-size="12">CONSTANT</text>
      <text x="134" y="146" text-anchor="end" fill="#D7F238" font-size="22" font-weight="700">×1</text>

      <text x="22" y="203" fill="#8EA0B8" font-size="12">LOGARITHMIC</text>
      <text x="134" y="204" text-anchor="end" fill="#D7F238" font-size="22" font-weight="700">+1</text>

      <text x="22" y="261" fill="#8EA0B8" font-size="12">LINEAR</text>
      <text x="134" y="262" text-anchor="end" fill="#D7F238" font-size="22" font-weight="700">×2</text>

      <text x="22" y="319" fill="#8EA0B8" font-size="12">n LOG n</text>
      <text x="134" y="320" text-anchor="end" fill="#D7F238" font-size="22" font-weight="700">&gt;×2</text>

      <text x="22" y="377" fill="#8EA0B8" font-size="12">QUADRATIC</text>
      <text x="134" y="378" text-anchor="end" fill="#D7F238" font-size="22" font-weight="700">×4</text>
    </g>

    <path d="M22 405H134" stroke="#53647A"/>
    <text x="22" y="430" fill="#FFFFFF" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="12">The slope is</text>
    <text x="22" y="447" fill="#FFFFFF" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="12">the warning</text>
    <text x="22" y="464" fill="#FFFFFF" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="12">signal.</text>
  </g>
</svg>
