<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="big-o-tradeoff-title big-o-tradeoff-desc">
  <title id="big-o-tradeoff-title">The time and space trade-off in duplicate detection</title>
  <desc id="big-o-tradeoff-desc">On the left, every pair of values is compared, using constant extra space but quadratic time. On the right, values are remembered in a hash set, using linear extra space for expected linear time.</desc>

  <defs>
    <pattern id="tradeoff-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#9AAAC0" stroke-width="1" opacity=".13"/>
    </pattern>
    <marker id="tradeoff-coral-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#F05A47"/>
    </marker>
    <marker id="tradeoff-blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#174AE4"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#F3F6FA"/>
  <rect width="1200" height="560" fill="url(#tradeoff-grid)"/>
  <rect width="18" height="560" fill="#174AE4"/>

  <g font-family="Avenir Next,Segoe UI,Arial,sans-serif">
    <text x="64" y="48" fill="#174AE4" font-size="14" font-weight="700" letter-spacing="2.6">ALGORITHM LAB / PLATE 02</text>
    <text x="64" y="96" fill="#14243A" font-size="40" font-weight="800" letter-spacing="-1.2">Same answer. Different resource bill.</text>
    <text x="66" y="127" fill="#53647A" font-size="17">To find a duplicate, choose where the cost should live.</text>
  </g>

  <path d="M600 154V516" stroke="#14243A" stroke-width="2"/>
  <rect x="563" y="265" width="74" height="70" fill="#D7F238" stroke="#14243A" stroke-width="2"/>
  <text x="600" y="288" text-anchor="middle" fill="#14243A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">MOVE</text>
  <text x="600" y="306" text-anchor="middle" fill="#14243A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">THE</text>
  <text x="600" y="324" text-anchor="middle" fill="#14243A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">COST</text>

  <g>
    <text x="66" y="177" fill="#F05A47" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.3">A / COMPARE EVERY PAIR</text>
    <text x="66" y="206" fill="#14243A" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="18">Keep no history; repeat the work.</text>

    <g transform="translate(78 237)">
      <g stroke="#F05A47" stroke-width="2.5" opacity=".34">
        <path d="M54 48L170 24L286 52L354 136L276 204L150 192L54 48"/>
        <path d="M54 48L286 52M54 48L354 136M54 48L276 204M54 48L150 192"/>
        <path d="M170 24L354 136M170 24L276 204M170 24L150 192"/>
        <path d="M286 52L276 204M286 52L150 192M354 136L150 192"/>
      </g>
      <path d="M54 48L276 204" stroke="#F05A47" stroke-width="7" marker-end="url(#tradeoff-coral-arrow)"/>

      <g fill="#F9FBFD" stroke="#14243A" stroke-width="2.5">
        <circle cx="54" cy="48" r="25"/>
        <circle cx="170" cy="24" r="25"/>
        <circle cx="286" cy="52" r="25"/>
        <circle cx="354" cy="136" r="25"/>
        <circle cx="276" cy="204" r="25"/>
        <circle cx="150" cy="192" r="25"/>
      </g>
      <g fill="#14243A" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700">
        <text x="54" y="54">7</text>
        <text x="170" y="30">2</text>
        <text x="286" y="58">9</text>
        <text x="354" y="142">4</text>
        <text x="276" y="210">7</text>
        <text x="150" y="198">1</text>
      </g>
      <circle cx="54" cy="48" r="31" fill="none" stroke="#F05A47" stroke-width="4"/>
      <circle cx="276" cy="204" r="31" fill="none" stroke="#F05A47" stroke-width="4"/>
    </g>

    <g transform="translate(66 478)">
      <text x="0" y="0" fill="#53647A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">WORST-CASE TIME</text>
      <text x="0" y="38" fill="#F05A47" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="32" font-weight="700">O(n²)</text>
      <text x="238" y="0" fill="#53647A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">EXTRA SPACE</text>
      <text x="238" y="38" fill="#2A9D8F" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="32" font-weight="700">O(1)</text>
    </g>
  </g>

  <g>
    <text x="678" y="177" fill="#174AE4" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.3">B / REMEMBER WHAT YOU SAW</text>
    <text x="678" y="206" fill="#14243A" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="18">Spend memory; avoid repeated work.</text>

    <g transform="translate(690 234)">
      <g font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle">
        <rect x="0" y="0" width="54" height="38" fill="#F9FBFD" stroke="#14243A" stroke-width="2"/>
        <text x="27" y="25" fill="#14243A">7</text>
        <rect x="0" y="52" width="54" height="38" fill="#F9FBFD" stroke="#14243A" stroke-width="2"/>
        <text x="27" y="77" fill="#14243A">2</text>
        <rect x="0" y="104" width="54" height="38" fill="#F9FBFD" stroke="#14243A" stroke-width="2"/>
        <text x="27" y="129" fill="#14243A">9</text>
        <rect x="0" y="156" width="54" height="38" fill="#F9FBFD" stroke="#14243A" stroke-width="2"/>
        <text x="27" y="181" fill="#14243A">4</text>
      </g>

      <g stroke="#174AE4" stroke-width="3" fill="none" marker-end="url(#tradeoff-blue-arrow)">
        <path d="M73 19H178"/>
        <path d="M73 71H178"/>
        <path d="M73 123H178"/>
        <path d="M73 175H178"/>
      </g>

      <text x="224" y="-10" text-anchor="middle" fill="#53647A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1">HASH SET</text>
      <g>
        <rect x="180" y="0" width="92" height="38" fill="#DCE6FF" stroke="#174AE4" stroke-width="2"/>
        <rect x="180" y="52" width="92" height="38" fill="#DCE6FF" stroke="#174AE4" stroke-width="2"/>
        <rect x="180" y="104" width="92" height="38" fill="#DCE6FF" stroke="#174AE4" stroke-width="2"/>
        <rect x="180" y="156" width="92" height="38" fill="#DCE6FF" stroke="#174AE4" stroke-width="2"/>
        <g fill="#174AE4" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle">
          <text x="226" y="25">7</text>
          <text x="226" y="77">2</text>
          <text x="226" y="129">9</text>
          <text x="226" y="181">4</text>
        </g>
      </g>

      <rect x="306" y="55" width="128" height="84" fill="#14243A"/>
      <text x="370" y="81" text-anchor="middle" fill="#D7F238" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">NEXT VALUE</text>
      <text x="370" y="119" text-anchor="middle" fill="#FFFFFF" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="30" font-weight="700">7</text>
      <path d="M306 98H274" stroke="#174AE4" stroke-width="4" marker-end="url(#tradeoff-blue-arrow)"/>
      <text x="370" y="161" text-anchor="middle" fill="#F05A47" font-family="Avenir Next,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">already present</text>
    </g>

    <g transform="translate(678 478)">
      <text x="0" y="0" fill="#53647A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">EXPECTED TIME</text>
      <text x="0" y="38" fill="#174AE4" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="32" font-weight="700">O(n)</text>
      <text x="238" y="0" fill="#53647A" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">EXTRA SPACE</text>
      <text x="238" y="38" fill="#7B4DCC" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="32" font-weight="700">O(n)</text>
    </g>
  </g>
</svg>
